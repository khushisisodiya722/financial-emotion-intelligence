# ============================================================
# Financial News Emotion Intelligence — Master Config
# ============================================================

project:
  name: "Financial News Emotion Intelligence"
  version: "1.0.0"
  author: "Khushi Sisodiya"
  institution: "Postgraduate Research Project"
  date: "2025"

# ----------------------------------------------------------
# Paths
# ----------------------------------------------------------
paths:
  data_raw: "data/raw"
  data_processed: "data/processed"
  data_external: "data/external"
  models: "models"
  outputs: "outputs"
  figures: "outputs/figures"
  tables: "outputs/tables"
  reports: "outputs/reports"
  notebooks: "notebooks"

# ----------------------------------------------------------
# Data Collection
# ----------------------------------------------------------
data_collection:
  start_date: "2018-01-01"
  end_date: "2025-06-30"
  target_articles: 20000
  min_article_length_words: 50
  max_article_length_words: 5000
  language: "en"

  gdelt:
    base_url: "http://data.gdelt.org"
    gkg_url: "http://data.gdelt.org/gkg"
    themes:
      - "ECON_"
      - "BUS_"
      - "ECON_BANKRUPTCY"
      - "ECON_STOCKMARKET"
      - "ECON_INTEREST_RATES"
      - "ECON_INFLATION"
      - "ECON_RBI"
    sample_files: 100

  kaggle:
    dataset_id: "kotartemiy/topic-labeled-news-dataset"
    alternative: "sbhatt1/all-the-news-dataset"
    financial_categories:
      - "business"
      - "finance"
      - "economy"
      - "markets"
      - "stock"

  rss_feeds:
    - name: "Economic Times"
      url: "https://economictimes.indiatimes.com/markets/rssfeeds/1977021501.cms"
      category: "markets"
    - name: "Economic Times Business"
      url: "https://economictimes.indiatimes.com/news/economy/rssfeeds/20309221.cms"
      category: "economy"
    - name: "Mint Markets"
      url: "https://www.livemint.com/rss/markets"
      category: "markets"
    - name: "Business Standard"
      url: "https://www.business-standard.com/rss/markets-106.rss"
      category: "markets"
    - name: "MoneyControl"
      url: "https://www.moneycontrol.com/rss/business.xml"
      category: "business"

# ----------------------------------------------------------
# Market Data
# ----------------------------------------------------------
market_data:
  tickers:
    nifty50: "^NSEI"
    sensex: "^BSESN"
    india_vix: "^NSEINDVIX"
  start_date: "2018-01-01"
  end_date: "2025-06-30"
  rolling_window_volatility: 21  # trading days
  lag_days: [1, 2, 3, 5]

# ----------------------------------------------------------
# Text Preprocessing
# ----------------------------------------------------------
preprocessing:
  min_tokens: 20
  max_tokens: 2000
  languages_keep: ["en"]
  remove_duplicates: true
  near_duplicate_threshold: 0.85  # Jaccard similarity
  stopwords_language: "english"

# ----------------------------------------------------------
# Emotion Lexicon
# ----------------------------------------------------------
emotion_lexicon:
  fear:
    - crash, panic, collapse, recession, crisis, threat, losses, turmoil
    - selloff, plunge, slump, nosedive, fear, alarming, devastating, catastrophic
    - meltdown, freefall, rout, bloodbath, carnage, dire, dread, bankruptcy
    - default, insolvency, contagion, systemic, shock, trauma, havoc
    - bearish, downturn, contraction, stagflation, hyperinflation, bust
  greed:
    - rally, boom, surge, record, bullish, opportunity, gains, upside
    - momentum, soar, climb, breakout, milestone, jackpot, bonanza
    - profit, reward, outperform, beat, exceed, unprecedented, stellar
    - euphoria, frenzy, mania, speculative, bubble, overvalued
    - buy, accumulate, overweight, upgrade, target, conviction
  uncertainty:
    - may, could, might, uncertain, concerns, risk, outlook, possibility
    - unclear, ambiguous, volatile, unpredictable, unknown, unclear
    - caution, wait, monitor, watch, pending, undecided, murky
    - depends, conditional, tentative, speculative, rumored, alleged
    - headwinds, challenges, risks, downside, upside-risk, scenario
  optimism:
    - growth, recovery, strong, improvement, expansion, positive, confidence
    - robust, resilient, recovery, stabilize, rebound, upswing, momentum
    - promise, potential, prospects, guidance, target, outperform
    - stable, healthy, solid, sustainable, consistent, steady, climb
    - bullish, constructive, encouraging, favorable, supportive

# ----------------------------------------------------------
# Emotion Modeling
# ----------------------------------------------------------
modeling:
  test_size: 0.15
  val_size: 0.15
  random_seed: 42
  use_time_split: true

  ml_models:
    - LogisticRegression
    - LinearSVC
    - RandomForest
    - XGBoost

  transformer:
    model_name: "ProsusAI/finbert"
    fallback_model: "distilbert-base-uncased"
    max_length: 512
    batch_size: 16
    epochs: 3
    learning_rate: 2.0e-5

  tfidf:
    max_features: 15000
    ngram_range: [1, 3]
    min_df: 3
    max_df: 0.85

# ----------------------------------------------------------
# FNEI Index
# ----------------------------------------------------------
fnei:
  formula: "weighted"  # options: simple, weighted, pca
  categories:
    extreme_fear: [0, 20]
    fear: [20, 40]
    neutral: [40, 60]
    greed: [60, 80]
    extreme_greed: [80, 100]
  rolling_window: 7  # days for smoothing

# ----------------------------------------------------------
# Event Study
# ----------------------------------------------------------
events:
  - name: "COVID-19 Market Crash"
    date: "2020-03-23"
    category: "pandemic"
  - name: "Russia-Ukraine Invasion"
    date: "2022-02-24"
    category: "geopolitical"
  - name: "US Fed Rate Hike Begins"
    date: "2022-03-16"
    category: "monetary_policy"
  - name: "Adani-Hindenburg Crisis"
    date: "2023-01-25"
    category: "corporate"
  - name: "SVB Banking Crisis"
    date: "2023-03-10"
    category: "banking"
  - name: "Indian Union Budget 2024"
    date: "2024-02-01"
    category: "fiscal_policy"
  - name: "Indian General Elections 2024"
    date: "2024-04-19"
    category: "political"
  - name: "RBI Rate Cut 2025"
    date: "2025-02-07"
    category: "monetary_policy"

event_window:
  pre_days: 7
  post_days: 7

# ----------------------------------------------------------
# Topic Modeling
# ----------------------------------------------------------
topic_modeling:
  lda_num_topics: 10
  lda_passes: 20
  bertopic_min_topic_size: 30

# ----------------------------------------------------------
# Visualization
# ----------------------------------------------------------
colors:
  fear: "#E53935"
  greed: "#43A047"
  uncertainty: "#FB8C00"
  optimism: "#1E88E5"
  neutral: "#757575"
  background: "#0D1117"
  surface: "#161B22"
  text: "#E6EDF3"
  accent: "#58A6FF"

# ----------------------------------------------------------
# Streamlit App
# ----------------------------------------------------------
app:
  title: "Financial Emotion Analyzer"
  subtitle: "NLP-Powered Emotion Intelligence for Financial Markets"
  live_rss_url: "https://economictimes.indiatimes.com/markets/rssfeeds/1977021501.cms"
